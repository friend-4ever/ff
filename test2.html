<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEXON PC - Smart ID Card Studio (Fail-Proof)</title>
    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #263238;
            --bg: #101518;
            --panel: #1a2327;
            --text: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background: #000;
            width: 100%;
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.2);
        }
        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 26px;
            letter-spacing: 2px;
        }
        
        .main-workspace {
            display: flex;
            gap: 25px;
            margin-top: 25px;
            width: 95%;
            max-width: 1350px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap; /* Supports smaller screens */
        }

        /* Controls Panel */
        .controls {
            background: var(--panel);
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }
        input[type="file"] {
            width: 90%;
            background: #333;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #444;
            color: white;
            cursor: pointer;
        }
        .target-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .target-btn {
            flex: 1;
            padding: 10px;
            background: #444;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        .target-btn.active {
            background: var(--primary);
            color: black;
            border-color: var(--primary);
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .slider-row { display: flex; align-items: center; justify-content: space-between; }
        .val-display { color: var(--primary); font-size: 13px; font-weight: bold; }

        .btn-print {
            width: 100%;
            background: var(--primary);
            color: black;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-print:hover { background: #00cc6a; box-shadow: 0 0 15px rgba(0, 255, 136, 0.5); }

        /* A4 Preview Area - Centered */
        .preview-wrapper {
            background: #fff;
            padding: 0;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            width: 210mm;
            min-height: 297mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25mm; /* Top margin */
            position: relative;
        }

        /* PVC Card Container (The Cropping Box) */
        .card-container {
            width: 85.6mm;
            height: 54mm;
            border: 2px dashed rgba(0, 229, 255, 0.6);
            margin-bottom: 8mm;
            position: relative;
            overflow: hidden; /* This automatically crops unwanted area */
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .card-container img {
            position: absolute;
            max-width: none; /* Allows infinite zoom */
            transition: filter 0.05s;
            cursor: move;
        }

        /* Instructions */
        .tip { font-size: 12px; color: #ff0055; font-weight: bold; margin-bottom: 5px; }

        @media print {
            body { background: white; margin: 0; }
            .header, .controls, .tip { display: none !important; }
            .main-workspace { margin: 0; width: 100%; }
            .preview-wrapper { box-shadow: none; padding-top: 10mm; }
            .card-container { border: none; margin-bottom: 2mm; background: none; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ZEXON PC - SMART ID PRO v1.1</h1>
    </div>

    <div class="main-workspace">
        <!-- Sliders Panel -->
        <div class="controls">
            <div class="control-group">
                <label>1. Front Side Upload</label>
                <input type="file" id="uploadFront" accept="image/*">
            </div>
            <div class="control-group">
                <label>2. Back Side Upload</label>
                <input type="file" id="uploadBack" accept="image/*">
            </div>

            <hr style="border-color: #444; margin: 15px 0;">

            <label>Select Side to Adjust:</label>
            <div class="target-selector">
                <button class="target-btn active" id="btnFront" onclick="selectTarget('front')">FRONT</button>
                <button class="target-btn" id="btnBack" onclick="selectTarget('back')">BACK</button>
            </div>

            <!-- Position/Crop Controls -->
            <div class="control-group">
                <div class="slider-row"><label>Move Left/Right</label><span class="val-display" id="valMoveX">0mm</span></div>
                <input type="range" id="moveX" min="-50" max="50" value="0">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Move Up/Down</label><span class="val-display" id="valMoveY">0mm</span></div>
                <input type="range" id="moveY" min="-50" max="50" value="0">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Zoom (Scale)</label><span class="val-display" id="valZoom">100%</span></div>
                <input type="range" id="zoom" min="50" max="300" value="100">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Rotate (Teda Theek Kare)</label><span class="val-display" id="valRotate">0°</span></div>
                <input type="range" id="rotate" min="-45" max="45" value="0">
            </div>

            <hr style="border-color: #444; margin: 15px 0;">

            <!-- Lighting Controls -->
            <div class="control-group">
                <div class="slider-row"><label>Brightness</label><span class="val-display" id="valBright">100%</span></div>
                <input type="range" id="brightness" min="50" max="200" value="100">
            </div>
            <div class="control-group">
                <div class="slider-row"><label>Contrast</label><span class="val-display" id="valContrast">100%</span></div>
                <input type="range" id="contrast" min="50" max="200" value="100">
            </div>

            <button class="btn-print" onclick="window.print()">🖨️ FINAL PRINT</button>
        </div>

        <!-- Preview Area (Centered A4) -->
        <div>
            <div class="preview-wrapper">
                <p class="tip">Note: Sliders ka use karke card ko dashed box ke andar fit karein.</p>
                <!-- Front Card Slot -->
                <div class="card-container">
                    <img id="imgFront" src="" style="display:none;" alt="Front Side">
                </div>
                <!-- Back Card Slot -->
                <div class="card-container">
                    <img id="imgBack" src="" style="display:none;" alt="Back Side">
                </div>
            </div>
        </div>
    </div>

    <script>
        // State for both images
        const state = {
            front: { x: 0, y: 0, zoom: 100, rotate: 0, bright: 100, contrast: 100 },
            back: { x: 0, y: 0, zoom: 100, rotate: 0, bright: 100, contrast: 100 }
        };

        let activeTarget = 'front';
        const imgFront = document.getElementById('imgFront');
        const imgBack = document.getElementById('imgBack');
        
        // File Upload Handlers
        document.getElementById('uploadFront').addEventListener('change', (e) => loadFile(e, 'front', imgFront));
        document.getElementById('uploadBack').addEventListener('change', (e) => loadFile(e, 'back', imgBack));

        function loadFile(event, target, imgElement) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgElement.src = e.target.result;
                    imgElement.style.display = 'block';
                    // Reset position/transforms for new image
                    state[target] = { x: 0, y: 0, zoom: 100, rotate: 0, bright: 100, contrast: 100 };
                    selectTarget(target);
                    applyTransforms(target);
                }
                reader.readAsDataURL(file);
            }
        }

        // Switch Tabs (Front/Back)
        function selectTarget(target) {
            activeTarget = target;
            document.getElementById('btnFront').className = target === 'front' ? 'target-btn active' : 'target-btn';
            document.getElementById('btnBack').className = target === 'back' ? 'target-btn active' : 'target-btn';
            
            // Update sliders to match active image state
            document.getElementById('moveX').value = state[target].x;
            document.getElementById('moveY').value = state[target].y;
            document.getElementById('zoom').value = state[target].zoom;
            document.getElementById('rotate').value = state[target].rotate;
            document.getElementById('brightness').value = state[target].bright;
            document.getElementById('contrast').value = state[target].contrast;
            updateLabels();
        }

        // --- Core: Sliders Event Listeners ---
        const sliderIds = ['moveX', 'moveY', 'zoom', 'rotate', 'brightness', 'contrast'];
        sliderIds.forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                
                // Update state
                if(id === 'moveX') state[activeTarget].x = val;
                if(id === 'moveY') state[activeTarget].y = val;
                if(id === 'zoom') state[activeTarget].zoom = val;
                if(id === 'rotate') state[activeTarget].rotate = val;
                if(id === 'brightness') state[activeTarget].bright = val;
                if(id === 'contrast') state[activeTarget].contrast = val;
                
                updateLabels();
                applyTransforms(activeTarget);
            });
        });

        function updateLabels() {
            const s = state[activeTarget];
            document.getElementById('valMoveX').innerText = s.x + 'mm';
            document.getElementById('valMoveY').innerText = s.y + 'mm';
            document.getElementById('valZoom').innerText = s.zoom + '%';
            document.getElementById('valRotate').innerText = s.rotate + '°';
            document.getElementById('valBright').innerText = s.bright + '%';
            document.getElementById('valContrast').innerText = s.contrast + '%';
        }

        // --- Core: Apply Transforms (Rotate & Warp Fix) ---
        function applyTransforms(target) {
            const img = target === 'front' ? imgFront : imgBack;
            const s = state[target];
            
            // Step 1: Lighting Filters
            img.style.filter = `brightness(${s.bright}%) contrast(${s.contrast}%)`;
            
            // Step 2: Position, Zoom, Rotate (Must be in this order)
            // Using translate3d for hardware acceleration/smooth performance
            img.style.transform = `translate3d(${s.x}mm, ${s.y}mm, 0) scale(${s.zoom / 100}) rotate(${s.rotate}deg)`;
        }

    </script>
</body>
</html>
