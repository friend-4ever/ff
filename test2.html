<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEXON PC - AI Smart ID Printer</title>
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript" onload="onOpenCvReady()"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #3a7bd5;
            --bg: #0f0f0f;
            --card-bg: #1e1e1e;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .navbar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .navbar h1 { margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; color: black; }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px; /* Niche shift kiya gaya hai */
            width: 100%;
        }

        .controls-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border: 1px solid #333;
            flex-wrap: wrap;
            justify-content: center;
        }

        .upload-box {
            background: #2b2b2b;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .btn-print {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-print:hover { background: #218838; transform: scale(1.05); }

        /* A4 Preview - Middle Mein Center */
        .preview-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            padding-bottom: 50px;
        }

        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20mm;
            position: relative;
        }

        /* Standard PVC Size: 85.6mm x 54mm */
        .canvas-container {
            width: 85.6mm;
            height: 54mm;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #f9f9f9;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }

        #status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #666;
        }

        @media print {
            .navbar, .controls-panel, #status { display: none; }
            body { background: white; margin: 0; }
            .main-container { margin-top: 0; }
            .preview-wrapper { padding: 0; }
            .a4-page { box-shadow: none; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>ZEXON PC - AI AUTO SCANNER V2</h1>
    </div>

    <div class="main-container">
        <div class="controls-panel">
            <div class="upload-box">
                <label>Front Side (Teda Photo Chalega):</label><br><br>
                <input type="file" id="fileFront" accept="image/*">
            </div>
            <div class="upload-box">
                <label>Back Side (Auto-Crop):</label><br><br>
                <input type="file" id="fileBack" accept="image/*">
            </div>
            <div style="display: flex; align-items: center;">
                <button class="btn-print" onclick="window.print()">PRINT PREVIEW</button>
            </div>
        </div>

        <div class="preview-wrapper">
            <div class="a4-page">
                <div class="canvas-container">
                    <canvas id="canvasFront"></canvas>
                </div>
                <div class="canvas-container">
                    <canvas id="canvasBack"></canvas>
                </div>
                <p style="color: #ccc; font-size: 10px; position: absolute; bottom: 10px;">Processed by ZEXON PC Smart AI</p>
            </div>
        </div>
    </div>

    <div id="status">AI Engine: Loading...</div>

    <script>
        let cvReady = false;
        function onOpenCvReady() {
            cvReady = true;
            document.getElementById('status').innerText = "AI Engine: Ready";
            document.getElementById('status').style.color = "#00ff88";
        }

        document.getElementById('fileFront').addEventListener('change', (e) => processID(e, 'canvasFront'));
        document.getElementById('fileBack').addEventListener('change', (e) => processID(e, 'canvasBack'));

        function processID(event, canvasId) {
            if (!cvReady) { alert("AI Engine load ho raha hai, please wait..."); return; }
            
            const file = event.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(res) {
                const img = new Image();
                img.onload = function() {
                    autoCropAndWarp(img, canvasId);
                };
                img.src = res.target.result;
            };
            reader.readAsDataURL(file);
        }

        function autoCropAndWarp(imageSource, canvasId) {
            // OpenCV magic start
            let src = cv.imread(imageSource);
            let dst = new cv.Mat();
            let dsize = new cv.Size(src.cols, src.rows);
            
            // 1. Grayscale and Blur (Noise hatane ke liye)
            cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0);
            cv.GaussianBlur(dst, dst, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
            
            // 2. Edge Detection (Corner dhundne ke liye)
            cv.Canny(dst, dst, 75, 200, 3, false);
            
            // 3. Find Contours
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(dst, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            
            // Sabse bada area wala contour dhundo (jo card hai)
            let maxArea = 0;
            let maxContourIndex = -1;
            for (let i = 0; i < contours.size(); ++i) {
                let area = cv.contourArea(contours.item(i));
                if (area > maxArea) {
                    maxArea = area;
                    maxContourIndex = i;
                }
            }

            if (maxContourIndex !== -1) {
                let cnt = contours.item(maxContourIndex);
                let peri = cv.arcLength(cnt, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                // Agar 4 corners mil gaye (Rectangular shape)
                if (approx.rows == 4) {
                    // Perspective Transform (Photoshop jaisa seedha karna)
                    let corners = [];
                    for (let i = 0; i < 4; i++) {
                        corners.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
                    }

                    // Sort corners: top-left, top-right, bottom-right, bottom-left
                    corners.sort((a, b) => a.y - b.y);
                    let top = corners.slice(0, 2).sort((a, b) => a.x - b.x);
                    let bottom = corners.slice(2, 4).sort((a, b) => a.x - b.x);
                    
                    let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
                        top[0].x, top[0].y, top[1].x, top[1].y,
                        bottom[1].x, bottom[1].y, bottom[0].x, bottom[0].y
                    ]);

                    // Standard PVC Card Ratio 85.6 : 54
                    const finalW = 856;
                    const finalH = 540;
                    let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
                        0, 0, finalW, 0, finalW, finalH, 0, finalH
                    ]);

                    let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
                    let finalDst = new cv.Mat();
                    cv.warpPerspective(src, finalDst, M, new cv.Size(finalW, finalH), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
                    
                    cv.imshow(canvasId, finalDst);
                    
                    // Memory Cleanup
                    finalDst.delete(); M.delete(); srcCoords.delete(); dstCoords.delete();
                } else {
                    // Agar detection clear nahi hai, toh normal display karega
                    cv.imshow(canvasId, src);
                }
                approx.delete();
            } else {
                cv.imshow(canvasId, src);
            }

            // Cleanup
            src.delete(); dst.delete(); contours.delete(); hierarchy.delete();
        }
    </script>
</body>
</html>
