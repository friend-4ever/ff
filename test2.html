<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEXON PC - Auto AI Print</title>
    <!-- AI Engine (OpenCV) Loaded directly -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="aiReady()" type="text/javascript"></script>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #121212;
            --panel: #1e1e1e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Loading Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .spinner {
            border: 5px solid #333; border-top: 5px solid var(--primary);
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .header { background: #000; width: 100%; padding: 15px; text-align: center; border-bottom: 2px solid var(--primary); }
        .header h1 { color: var(--primary); margin: 0; font-size: 28px; letter-spacing: 2px; }

        .workspace { display: flex; gap: 30px; margin-top: 30px; width: 95%; max-width: 1200px; justify-content: center; flex-wrap: wrap; }
        
        .controls { background: var(--panel); padding: 25px; border-radius: 10px; width: 350px; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .upload-box { background: #2b2b2b; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px dashed #555; }
        .upload-box label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary); font-size: 16px; }
        input[type="file"] { width: 90%; background: #111; color: white; padding: 10px; border-radius: 5px; cursor: pointer; }
        
        .btn-print { background: var(--primary); color: #000; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-print:hover { background: #00cc6a; }

        /* A4 Preview Area */
        .preview-area { background: #fff; padding: 0; border-radius: 5px; width: 210mm; min-height: 297mm; display: flex; flex-direction: column; align-items: center; padding-top: 25mm; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        
        /* 85.6mm x 54mm PVC Card Size */
        .pvc-card { width: 85.6mm; height: 54mm; margin-bottom: 10mm; background: #f0f0f0; border: 1px solid #ddd; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .pvc-card canvas { width: 100%; height: 100%; }

        .hidden { display: none; }

        @media print {
            body { background: white; }
            .header, .controls, #loader { display: none !important; }
            .preview-area { box-shadow: none; width: 100%; padding-top: 5mm; }
            .pvc-card { border: none; margin-bottom: 2mm; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color: var(--primary); margin-top: 20px;">ZEXON AI Loading...</h2>
        <p>Please wait while the Auto-Scanner Engine starts.</p>
    </div>

    <div class="header">
        <h1>ZEXON PC - 100% AUTO ID SCANNER</h1>
    </div>

    <div class="workspace">
        <!-- Control Panel -->
        <div class="controls">
            <h3 style="text-align: center; margin-top: 0; color: #aaa;">Upload & Auto-Process</h3>
            
            <div class="upload-box">
                <label>1. Front Side Upload</label>
                <input type="file" id="uploadFront" accept="image/*">
                <p id="statusFront" style="font-size: 12px; color: #aaa;">Waiting for image...</p>
            </div>

            <div class="upload-box">
                <label>2. Back Side Upload</label>
                <input type="file" id="uploadBack" accept="image/*">
                <p id="statusBack" style="font-size: 12px; color: #aaa;">Waiting for image...</p>
            </div>

            <button class="btn-print" onclick="window.print()">🖨️ FINAL PRINT</button>
        </div>

        <!-- A4 Page View -->
        <div class="preview-area">
            <div class="pvc-card"><canvas id="canvasFront"></canvas></div>
            <div class="pvc-card"><canvas id="canvasBack"></canvas></div>
        </div>
    </div>

    <!-- Hidden Images for Processing -->
    <img id="hiddenFront" class="hidden" alt="">
    <img id="hiddenBack" class="hidden" alt="">

    <script>
        let aiIsReady = false;

        // Triggered when OpenCV loads
        function aiReady() {
            aiIsReady = true;
            document.getElementById('loader').style.display = 'none';
        }

        // File Handlers
        document.getElementById('uploadFront').addEventListener('change', (e) => handleImage(e, 'hiddenFront', 'canvasFront', 'statusFront'));
        document.getElementById('uploadBack').addEventListener('change', (e) => handleImage(e, 'hiddenBack', 'canvasBack', 'statusBack'));

        function handleImage(event, imgId, canvasId, statusId) {
            if (!aiIsReady) return alert("AI is still loading. Please wait 2 seconds.");
            
            const file = event.target.files[0];
            if (!file) return;

            const statusText = document.getElementById(statusId);
            statusText.innerText = "⏳ Processing Automatically...";
            statusText.style.color = "yellow";

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById(imgId);
                imgElement.onload = function() {
                    // Start AI Auto Crop & Warp
                    setTimeout(() => autoProcessCard(imgElement, canvasId, statusId), 100);
                }
                imgElement.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // Core AI Function (No manual dots, 100% Automatic)
        function autoProcessCard(imgElement, canvasId, statusId) {
            let src = cv.imread(imgElement);
            let gray = new cv.Mat();
            let blur = new cv.Mat();
            let edges = new cv.Mat();

            // 1. Grayscale & Blur
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
            cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);

            // 2. Edge Detection
            cv.Canny(blur, edges, 75, 200, 3, false);
            
            // 3. Find Contours
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            let maxArea = 0;
            let bestApprox = null;

            // 4. Find the largest rectangle (The ID Card)
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.item(i);
                let area = cv.contourArea(cnt);
                
                // Only consider large objects
                if (area > 10000) {
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                    
                    // If shape has 4 corners, it's our card
                    if (approx.rows === 4 && area > maxArea) {
                        maxArea = area;
                        if (bestApprox) bestApprox.delete();
                        bestApprox = approx;
                    } else {
                        approx.delete();
                    }
                }
            }

            // Standard PVC Width and Height (High Res for Print)
            const finalW = 856;
            const finalH = 540;
            let finalDest = new cv.Mat();

            if (bestApprox) {
                // SUCCESS: AI Found the card, now automatically straighten (Warp) it
                let pts = [];
                for (let i = 0; i < 4; i++) {
                    pts.push({ x: bestApprox.data32S[i * 2], y: bestApprox.data32S[i * 2 + 1] });
                }

                // Sort Corners: Top-Left, Top-Right, Bottom-Right, Bottom-Left
                pts.sort((a, b) => a.y - b.y);
                let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
                let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
                let orderedPts = [top[0], top[1], bottom[1], bottom[0]];

                let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    orderedPts[0].x, orderedPts[0].y, orderedPts[1].x, orderedPts[1].y,
                    orderedPts[2].x, orderedPts[2].y, orderedPts[3].x, orderedPts[3].y
                ]);

                let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    0, 0, finalW, 0, finalW, finalH, 0, finalH
                ]);

                // Magic Perspective Transform
                let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
                cv.warpPerspective(src, finalDest, M, new cv.Size(finalW, finalH));

                // Cleanup
                srcCoords.delete(); dstCoords.delete(); M.delete(); bestApprox.delete();
                
                document.getElementById(statusId).innerText = "✅ Auto-Cropped & Straightened!";
                document.getElementById(statusId).style.color = "#00ff88";

            } else {
                // FAILSAFE: Agar AI document detect nahi kar paaya due to bad light/background,
                // toh hum directly image ko PVC size mein crop aur fit kar denge taaki error na aaye.
                cv.resize(src, finalDest, new cv.Size(finalW, finalH), 0, 0, cv.INTER_AREA);
                document.getElementById(statusId).innerText = "⚠️ Auto-Fit applied (Edges not clear)";
                document.getElementById(statusId).style.color = "orange";
            }

            // Draw to Final Canvas
            cv.imshow(canvasId, finalDest);

            // Clean Memory
            src.delete(); gray.delete(); blur.delete(); edges.delete(); contours.delete(); hierarchy.delete(); finalDest.delete();
        }
    </script>
</body>
</html>
