<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEXON PC - Pro ID Printer</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #121212;
            --panel: #1e1e1e;
            --text: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background: #000;
            width: 100%;
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2);
        }
        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }
        
        .main-workspace {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            width: 95%;
            max-width: 1300px;
            justify-content: center;
            align-items: flex-start;
        }

        /* Controls Panel */
        .controls {
            background: var(--panel);
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .control-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
        }
        input[type="file"] {
            width: 90%;
            background: #2b2b2b;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            color: white;
            cursor: pointer;
        }
        .side-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .side-btn {
            flex: 1;
            padding: 10px;
            background: #333;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        .side-btn.active {
            background: var(--primary);
            color: black;
            border-color: var(--primary);
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }
        .val-display { float: right; color: var(--primary); }

        .btn-print {
            width: 100%;
            background: var(--primary);
            color: black;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .btn-print:hover { background: #00cc6a; }

        /* A4 Preview Area - Centered */
        .preview-wrapper {
            background: #fff;
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            width: 210mm;
            min-height: 297mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25mm; /* Top margin */
            position: relative;
        }
        .instruction {
            color: #ff0055;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* PVC Card Setup */
        .card-container {
            width: 85.6mm;
            height: 54mm;
            border: 2px dashed #00a2ff;
            margin-bottom: 5mm;
            position: relative;
            overflow: hidden; /* Cuts off unwanted parts */
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .card-container img {
            position: absolute;
            cursor: grab;
            max-width: none; /* Allows zoom without limit */
            transition: filter 0.1s;
        }
        .card-container img:active {
            cursor: grabbing;
        }

        @media print {
            body { background: white; margin: 0; }
            .header, .controls, .instruction { display: none !important; }
            .main-workspace { margin: 0; width: 100%; }
            .preview-wrapper { box-shadow: none; padding-top: 10mm; }
            .card-container { border: none; margin-bottom: 2mm; background: none; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ZEXON PC - PRO ID STUDIO</h1>
    </div>

    <div class="main-workspace">
        <!-- Tools Panel -->
        <div class="controls">
            <div class="control-group">
                <label>1. Upload Front Side</label>
                <input type="file" id="uploadFront" accept="image/*">
            </div>
            <div class="control-group">
                <label>2. Upload Back Side</label>
                <input type="file" id="uploadBack" accept="image/*">
            </div>

            <hr style="border-color: #444; margin: 20px 0;">

            <label>Select Side to Edit / Adjust:</label>
            <div class="side-selector">
                <button class="side-btn active" id="btnFront" onclick="selectSide('front')">FRONT</button>
                <button class="side-btn" id="btnBack" onclick="selectSide('back')">BACK</button>
            </div>

            <div class="control-group">
                <label>Rotate (Teda Theek Kare) <span class="val-display" id="valRotate">0°</span></label>
                <input type="range" id="rotate" min="-45" max="45" value="0">
            </div>
            
            <div class="control-group">
                <label>Zoom (Scale) <span class="val-display" id="valZoom">100%</span></label>
                <input type="range" id="zoom" min="50" max="250" value="100">
            </div>

            <div class="control-group">
                <label>Brightness <span class="val-display" id="valBright">100%</span></label>
                <input type="range" id="brightness" min="50" max="200" value="100">
            </div>

            <div class="control-group">
                <label>Contrast <span class="val-display" id="valContrast">100%</span></label>
                <input type="range" id="contrast" min="50" max="200" value="100">
            </div>

            <button class="btn-print" onclick="window.print()">FINAL PRINT</button>
        </div>

        <!-- Preview Panel -->
        <div>
            <p class="instruction">💡 Tip: Photo par mouse click karke drag (kheecho) alignment theek karne ke liye.</p>
            <div class="preview-wrapper">
                <!-- Front Side -->
                <div class="card-container">
                    <img id="imgFront" src="" style="display:none;" alt="Front Side">
                </div>
                <!-- Back Side -->
                <div class="card-container">
                    <img id="imgBack" src="" style="display:none;" alt="Back Side">
                </div>
            </div>
        </div>
    </div>

    <script>
        // State management for both images
        const state = {
            front: { x: 0, y: 0, rotate: 0, zoom: 100, bright: 100, contrast: 100 },
            back: { x: 0, y: 0, rotate: 0, zoom: 100, bright: 100, contrast: 100 }
        };

        let currentSide = 'front';
        let isDragging = false;
        let startX, startY;

        // Elements
        const imgFront = document.getElementById('imgFront');
        const imgBack = document.getElementById('imgBack');
        
        // File Upload Handlers
        document.getElementById('uploadFront').addEventListener('change', (e) => loadFile(e, 'front', imgFront));
        document.getElementById('uploadBack').addEventListener('change', (e) => loadFile(e, 'back', imgBack));

        function loadFile(event, side, imgElement) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgElement.src = e.target.result;
                    imgElement.style.display = 'block';
                    // Reset position when new image is uploaded
                    state[side] = { x: 0, y: 0, rotate: 0, zoom: 100, bright: 100, contrast: 100 };
                    selectSide(side);
                    applyTransforms(side);
                }
                reader.readAsDataURL(file);
            }
        }

        // Switch Tabs
        function selectSide(side) {
            currentSide = side;
            document.getElementById('btnFront').className = side === 'front' ? 'side-btn active' : 'side-btn';
            document.getElementById('btnBack').className = side === 'back' ? 'side-btn active' : 'side-btn';
            
            // Update sliders to match selected side's current state
            document.getElementById('rotate').value = state[side].rotate;
            document.getElementById('zoom').value = state[side].zoom;
            document.getElementById('brightness').value = state[side].bright;
            document.getElementById('contrast').value = state[side].contrast;
            updateLabels();
        }

        // Sliders Event Listeners
        const sliders = ['rotate', 'zoom', 'brightness', 'contrast'];
        sliders.forEach(slider => {
            document.getElementById(slider).addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                if(slider === 'brightness') state[currentSide].bright = val;
                if(slider === 'contrast') state[currentSide].contrast = val;
                if(slider === 'rotate') state[currentSide].rotate = val;
                if(slider === 'zoom') state[currentSide].zoom = val;
                updateLabels();
                applyTransforms(currentSide);
            });
        });

        function updateLabels() {
            document.getElementById('valRotate').innerText = state[currentSide].rotate + '°';
            document.getElementById('valZoom').innerText = state[currentSide].zoom + '%';
            document.getElementById('valBright').innerText = state[currentSide].bright + '%';
            document.getElementById('valContrast').innerText = state[currentSide].contrast + '%';
        }

        // Apply Transform & Filter Engine
        function applyTransforms(side) {
            const img = side === 'front' ? imgFront : imgBack;
            const s = state[side];
            
            // Translate (X, Y) must be applied first, then Rotate, then Scale
            img.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rotate}deg) scale(${s.zoom / 100})`;
            img.style.filter = `brightness(${s.bright}%) contrast(${s.contrast}%)`;
        }

        // Drag & Drop Functionality (Photoshop Pan Style)
        function setupDrag(imgElement, side) {
            imgElement.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isDragging = true;
                // Calculate difference between mouse click and current image position
                startX = e.clientX - state[side].x;
                startY = e.clientY - state[side].y;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging || currentSide !== side) return;
                // Only move the active image being dragged
                state[side].x = e.clientX - startX;
                state[side].y = e.clientY - startY;
                applyTransforms(side);
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });
        }

        setupDrag(imgFront, 'front');
        setupDrag(imgBack, 'back');

    </script>
</body>
</html>
